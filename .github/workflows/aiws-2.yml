name: AIWS 2.0
on: [push, pull_request]
jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiws-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aiws-2.0/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run bench
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build:site
      - run: npm run test:e2e
        env:
          AIWS_SITE_ROOT: site
          AIWS_ARTIFACT_DIR: ${{ runner.temp }}/aiws-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiws-studio-screenshots
          path: ${{ runner.temp }}/aiws-review
          if-no-files-found: ignore
